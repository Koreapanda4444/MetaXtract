schema = 1
require_exact_versions = true
require_source_revisions = true
require_license_review = true
bundle_runtime_libraries = true

allowed_licenses = [
  "CC0-1.0",
  "MIT-0",
  "0BSD",
  "bzip2-1.0.6",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-1-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDDL-1.0",
  "IJG",
  "ISC",
  "LGPL-2.1-only",
  "LGPL-2.1-or-later",
  "LGPL-3.0-or-later",
  "MIT",
  "MPL-1.1",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

allowed_license_exceptions = ["LLVM-exception"]

denied_licenses = [
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
  "GPL-2.0-only",
  "GPL-2.0-or-later",
  "GPL-3.0-only",
  "GPL-3.0-or-later",
]

forbidden_runtime_executables = ["exiftool", "ffprobe"]
