[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "metaxtract"
version = "0.1.0"
description = "Local metadata scanner and verifiable case bundle toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=44.0",
    "Pillow>=10.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "ruff>=0.8",
]
package = [
    "pyinstaller>=6.11",
]

[project.scripts]
metaxtract = "metaxtract.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
