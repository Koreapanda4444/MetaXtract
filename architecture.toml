schema = 1

[components.schema]
path = "crates/metaxtract-schema"
language = "rust"
allows = []

[components.core]
path = "crates/metaxtract-core"
language = "rust"
allows = ["schema", "native"]

[components.native]
path = "crates/metaxtract-native"
language = "rust-cpp-bridge"
allows = ["schema"]

[components.extractor]
path = "native/metaxtract-extract"
language = "cpp"
allows = []

[components.worker]
path = "crates/metaxtract-worker"
language = "rust"
allows = ["core"]

[components.storage]
path = "crates/metaxtract-storage"
language = "rust"
allows = ["schema"]

[components.python_reference]
path = "legacy/python"
language = "python"
allows = []
production = false

[components.analysis]
path = "crates/metaxtract-analysis"
language = "rust"
allows = ["schema", "storage"]

[rules]
product_owner = "rust"
raw_extraction_owner = "cpp"
external_executables = false
native_filesystem_writes = false
native_network_access = false
exceptions_across_ffi = false
opaque_library_objects_across_ffi = false
python_in_production = false
bundled_parser_worker = true
