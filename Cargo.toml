[workspace]
members = [
  "crates/metaxtract-core",
  "crates/metaxtract-native",
  "crates/metaxtract-schema",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
cxx = "=1.0.205"
cxx-build = "=1.0.205"
cmake = "=0.1.58"
cap-std = "=3.4.5"
cap-fs-ext = "=3.4.5"
sha2 = "=0.10.9"
blake3 = "=1.8.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["arbitrary_precision"] }
rusqlite = { version = "=0.37.0", features = ["bundled", "limits"] }
tempfile = "=3.23.0"
metaxtract-schema = { path = "crates/metaxtract-schema" }
metaxtract-native = { path = "crates/metaxtract-native" }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
