name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build_plan:
    name: Build or reuse verified packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      package_run_id: ${{ steps.plan.outputs.package_run_id }}
    steps:
      - name: Reuse only unchanged, previously verified build inputs
        id: plan
        uses: actions/github-script@v8
        with:
          retries: 3
          script: |
            if (context.eventName !== 'push' || context.ref !== 'refs/heads/main') return;
            const permitted = new Set([
              '.github/workflows/ci.yml', 'packaging/verify.py',
              'docs/packaging.md', 'docs/packaging_KR.md'
            ]);
            const guide = /^(?:README(?:_KR)?\.md|docs\/[^/]+\.md|(?:conformance|crates|native)\/README(?:_KR)?\.md)$/;
            const allowed = path => permitted.has(path) || guide.test(path);
            const required = [
              'Rust / C++ (ubuntu-latest)', 'Rust / C++ (windows-latest)',
              'Rust / C++ (macos-latest)', 'Native and FFI sanitizers'
            ];
            const packages = ['Rust-MetaXtract-Linux-X64', 'Rust-MetaXtract-Windows-X64',
              'Rust-MetaXtract-macOS-ARM64'];
            function buildSettings(text) {
              const marker = '\njobs:\n';
              const start = text.indexOf(marker);
              if (start < 0) throw new Error('Workflow has no jobs section');
              const chunks = text.slice(start + marker.length).split(/(?=^  [A-Za-z0-9_-]+:[ \t]*$)/m);
              const retained = chunks.filter(chunk => !/^  (build_plan|installed-native):/.test(chunk));
              return text.slice(0, start) + marker + retained.join('')
                .replace(/^    needs: build_plan\n/gm, '')
                .replace(/^    if: needs\.build_plan\.outputs\.package_run_id == ''\n/gm, '')
                .trimEnd() + '\n';
            }
            async function workflowAt(ref) {
              const response = await github.rest.repos.getContent({
                ...context.repo, path: '.github/workflows/ci.yml', ref
              });
              return Buffer.from(response.data.content, 'base64').toString('utf8');
            }
            const current = buildSettings(await workflowAt(context.sha));
            const runs = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'ci.yml', branch: 'main', event: 'push',
              status: 'completed', per_page: 10
            });
            for (const run of runs.data.workflow_runs) {
              if (run.id === context.runId) continue;
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo, basehead: run.head_sha + '...' + context.sha
              });
              const files = comparison.data.files;
              if (!files || files.length >= 300 ||
                  !['ahead', 'identical'].includes(comparison.data.status) ||
                  comparison.data.merge_base_commit.sha !== run.head_sha ||
                  files.some(file => !allowed(file.filename) ||
                    (file.previous_filename && !allowed(file.previous_filename)))) continue;
              if (buildSettings(await workflowAt(run.head_sha)) !== current) continue;
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                ...context.repo, run_id: run.id, per_page: 100
              });
              if (!required.every(name => jobs.some(job => job.name === name &&
                  job.status === 'completed' && job.conclusion === 'success'))) continue;
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: run.id, per_page: 100
              });
              if (!packages.every(name => artifacts.data.artifacts.some(artifact =>
                  artifact.name === name && !artifact.expired))) continue;
              core.info('Unchanged build inputs: reusing run ' + run.id + ' at ' + run.head_sha);
              core.setOutput('package_run_id', String(run.id));
              return;
            }
            core.info('No identical verified build; compile and validate all native jobs.');

  native:
    name: Rust / C++ (${{ matrix.os }})
    needs: build_plan
    if: needs.build_plan.outputs.package_run_id == ''
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_HOME: ${{ github.workspace }}/../metaxtract-rustup-${{ github.run_id }}-native
      METAXTRACT_NATIVE_BUILD_ROOT: ${{ github.workspace }}/../metaxtract-native-${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check native source archive pipes
        run: python packaging/build.py --check-source-archives
      - name: Install build and validation tools
        run: python -m pip install cmake==4.2.3 ninja==1.11.1.4 ruff==0.14.1
      - name: Install Windows native configure tools
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: make
          update: false
          path-type: inherit
      - name: Locate Windows native configure tools
        if: runner.os == 'Windows'
        env:
          METAXTRACT_MSYS_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: 'Add-Content -Path $env:GITHUB_ENV -Value "METAXTRACT_MSYS_ROOT=$env:METAXTRACT_MSYS_ROOT"'
      - name: Install pinned Rust toolchain
        run: |
          python -c "import os, shutil; shutil.rmtree(os.environ['RUSTUP_HOME'], ignore_errors=True)"
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustc --version
          cargo --version
      - name: Restore reviewed native source cache
        id: native-source-cache
        uses: actions/cache/restore@v4
        with:
          path: target/native-sources
          key: native-sources-${{ runner.os }}-${{ hashFiles('third-party.lock.toml', 'native/metaxtract-extract/dependencies.cmake') }}
      - name: Restore reviewed native media build cache
        id: native-media-cache
        uses: actions/cache/restore@v4
        with:
          path: target/native-ffmpeg
          key: native-media-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('third-party.lock.toml', 'native/metaxtract-extract/build_ffmpeg.py', 'native/metaxtract-extract/ffmpeg.cmake', 'rust-toolchain.toml') }}
      - name: Validate migration boundaries and locks
        run: |
          python conformance/validate.py --cargo
          python -m ruff check --target-version py311 --select E4,E7,E9,F,I packaging conformance
      - name: Verify upstream release commits
        if: runner.os == 'Linux'
        run: python conformance/validate.py --online
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check Rust warnings
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check Rust policy regressions
        run: cargo test --workspace --all-features --locked
      - name: Check debug extraction contracts
        run: python conformance/run.py
      - name: Save reviewed native source cache
        if: success() && steps.native-source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target/native-sources
          key: ${{ steps.native-source-cache.outputs.cache-primary-key }}
      - name: Save reviewed native media build cache
        if: always() && steps.native-media-cache.outputs.cache-hit != 'true' && hashFiles('target/native-ffmpeg/*/complete.json') != ''
        uses: actions/cache/save@v4
        with:
          path: target/native-ffmpeg
          key: ${{ steps.native-media-cache.outputs.cache-primary-key }}
      - name: Build production workspace
        run: cargo build --workspace --release --locked
      - name: Build standalone Rust package
        timeout-minutes: 15
        run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: Rust-MetaXtract-${{ runner.os }}-${{ runner.arch }}
          path: dist/MetaXtract-*
          compression-level: 0
          if-no-files-found: error
      - name: Configure native core
        run: cmake --preset dev
      - name: Build native core
        run: cmake --build --preset dev --config Debug
      - name: Check native core
        run: ctest --preset dev -C Debug
      - name: Check release extraction contracts
        run: python conformance/run.py --release

  installed-native:
    name: Installed Rust package (${{ matrix.os }})
    needs: [build_plan, native]
    if: always() && needs.build_plan.result == 'success' && (needs.native.result == 'success' || needs.build_plan.outputs.package_run_id != '')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packaging
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download current native package
        uses: actions/download-artifact@v4
        with:
          name: Rust-MetaXtract-${{ runner.os }}-${{ runner.arch }}
          path: package-current
          github-token: ${{ github.token }}
          run-id: ${{ needs.build_plan.outputs.package_run_id || github.run_id }}
      - name: Find previous successful native package
        id: previous-native
        uses: actions/github-script@v8
        env:
          PACKAGE_ARTIFACT: Rust-MetaXtract-${{ runner.os }}-${{ runner.arch }}
        with:
          retries: 3
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'ci.yml', branch: 'main', event: 'push',
              status: 'success', per_page: 30
            });
            for (const run of runs.data.workflow_runs) {
              if (run.id === context.runId) continue;
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: run.id, per_page: 100
              });
              if (artifacts.data.artifacts.some(a => a.name === process.env.PACKAGE_ARTIFACT && !a.expired)) {
                core.setOutput('run_id', String(run.id));
                return;
              }
            }
            core.info('No retained previous package; verify reinstall and schema migration.');
      - name: Download previous native package
        if: steps.previous-native.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: Rust-MetaXtract-${{ runner.os }}-${{ runner.arch }}
          path: previous-package
          github-token: ${{ github.token }}
          run-id: ${{ steps.previous-native.outputs.run_id }}
      - name: Prepare Windows CI software graphics
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mesa3d-26.2.4-release-msvc.7z'
          $directory = Join-Path $env:RUNNER_TEMP 'metaxtract-ci-mesa'
          Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695') {
            throw 'CI Mesa archive checksum differs'
          }
          7z x $archive "-o$directory" '-y' 'x64/*'
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract the CI graphics driver' }
          $driver = Join-Path $directory 'x64'
          if (!(Test-Path (Join-Path $driver 'opengl32.dll')) -or !(Test-Path (Join-Path $driver 'libgallium_wgl.dll'))) {
            throw 'CI graphics driver is incomplete'
          }
          Add-Content -Path $env:GITHUB_ENV -Value "METAXTRACT_CI_OPENGL=$driver"
      - name: Verify standalone installation (Linux)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-noto-cjk libxkbcommon-x11-0 libegl1 libgl1-mesa-dri
          xvfb-run -a python packaging/verify.py --dist package-current --previous-if-present previous-package --gui-smoke
      - name: Verify standalone installation (macOS)
        if: runner.os == 'macOS'
        run: python packaging/verify.py --dist package-current --previous-if-present previous-package --gui-smoke
      - name: Verify standalone installation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python packaging/verify.py --dist package-current --previous-if-present previous-package --gui-smoke --windows-opengl-directory "$env:METAXTRACT_CI_OPENGL"
      - uses: actions/upload-artifact@v4
        with:
          name: Rust-installation-${{ runner.os }}-${{ runner.arch }}
          path: package-current/installation-verification.json
          if-no-files-found: error

  cleanup-stalled-packaging:
    name: Stop superseded stalled packaging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'ci.yml', branch: 'main',
              event: 'push', status: 'in_progress', per_page: 30
            });
            for (const run of runs.data.workflow_runs) {
              if (run.id === context.runId || run.head_sha === context.sha) continue;
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                ...context.repo, run_id: run.id, per_page: 100
              });
              const stalled = jobs.data.jobs.some(job => (job.steps || []).some(step =>
                step.name === 'Build standalone Rust package' && step.status === 'in_progress' &&
                Date.now() - Date.parse(step.started_at) > 10 * 60 * 1000));
              if (stalled) {
                core.info('Stopping superseded stalled package run ' + run.id);
                await github.rest.actions.cancelWorkflowRun({...context.repo, run_id: run.id});
              }
            }

  native-sanitizers:
    name: Native and FFI sanitizers
    needs: build_plan
    if: needs.build_plan.outputs.package_run_id == ''
    runs-on: ubuntu-latest
    env:
      RUSTUP_HOME: ${{ github.workspace }}/../metaxtract-rustup-${{ github.run_id }}-sanitizers
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build and validation tools
        run: python -m pip install cmake==4.2.3 ninja==1.11.1.4
      - name: Install pinned Rust toolchain
        run: |
          python -c "import os, shutil; shutil.rmtree(os.environ['RUSTUP_HOME'], ignore_errors=True)"
          rustup toolchain install 1.88.0 --profile minimal
          rustc --version
          cargo --version
      - name: Check native core with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cmake --preset sanitize
          cmake --build --preset sanitize
          ctest --preset sanitize
      - name: Check the Rust C++ bridge with native sanitizers
        env:
          METAXTRACT_SANITIZERS: address,undefined
        run: python conformance/run.py
