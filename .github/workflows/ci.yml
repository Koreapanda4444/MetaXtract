name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  native:
    name: Rust / C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_HOME: ${{ github.workspace }}/../metaxtract-rustup-${{ github.run_id }}-native
      METAXTRACT_NATIVE_BUILD_ROOT: ${{ github.workspace }}/../metaxtract-native-${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools and Python reference
        run: python -m pip install -e "./legacy/python[dev]" cmake==4.2.3 ninja==1.11.1.4
      - name: Install Windows native configure tools
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: make
          update: false
          path-type: inherit
      - name: Locate Windows native configure tools
        if: runner.os == 'Windows'
        env:
          METAXTRACT_MSYS_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: 'Add-Content -Path $env:GITHUB_ENV -Value "METAXTRACT_MSYS_ROOT=$env:METAXTRACT_MSYS_ROOT"'
      - name: Install pinned Rust toolchain
        run: |
          python -c "import os, shutil; shutil.rmtree(os.environ['RUSTUP_HOME'], ignore_errors=True)"
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustc --version
          cargo --version
      - name: Restore reviewed native source cache
        id: native-source-cache
        uses: actions/cache/restore@v4
        with:
          path: target/native-sources
          key: native-sources-${{ runner.os }}-${{ hashFiles('third-party.lock.toml', 'native/metaxtract-extract/dependencies.cmake') }}
      - name: Restore reviewed native media build cache
        id: native-media-cache
        uses: actions/cache/restore@v4
        with:
          path: target/native-ffmpeg
          key: native-media-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('third-party.lock.toml', 'native/metaxtract-extract/build_ffmpeg.py', 'native/metaxtract-extract/ffmpeg.cmake', 'rust-toolchain.toml') }}
      - name: Validate migration boundaries and locks
        run: python conformance/validate.py --cargo
      - name: Verify upstream release commits
        if: runner.os == 'Linux'
        run: python conformance/validate.py --online
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check Rust warnings
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check Rust policy regressions
        run: cargo test --workspace --all-features --locked
      - name: Check debug extraction contracts
        run: python conformance/run.py
      - name: Save reviewed native source cache
        if: success() && steps.native-source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target/native-sources
          key: ${{ steps.native-source-cache.outputs.cache-primary-key }}
      - name: Save reviewed native media build cache
        if: always() && steps.native-media-cache.outputs.cache-hit != 'true' && hashFiles('target/native-ffmpeg/*/complete.json') != ''
        uses: actions/cache/save@v4
        with:
          path: target/native-ffmpeg
          key: ${{ steps.native-media-cache.outputs.cache-primary-key }}
      - name: Build production workspace
        run: cargo build --workspace --release --locked
      - name: Smoke-test Rust desktop
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-noto-cjk libxkbcommon-x11-0 libegl1 libgl1-mesa-dri
          xvfb-run -a cargo run -p metaxtract-gui --release --locked -- --smoke
      - name: Configure native core
        run: cmake --preset dev
      - name: Build native core
        run: cmake --build --preset dev --config Debug
      - name: Check native core
        run: ctest --preset dev -C Debug
      - name: Check release extraction contracts
        run: python conformance/run.py --release

  native-sanitizers:
    name: Native and FFI sanitizers
    runs-on: ubuntu-latest
    env:
      RUSTUP_HOME: ${{ github.workspace }}/../metaxtract-rustup-${{ github.run_id }}-sanitizers
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools and Python reference
        run: python -m pip install -e ./legacy/python cmake==4.2.3 ninja==1.11.1.4
      - name: Install pinned Rust toolchain
        run: |
          python -c "import os, shutil; shutil.rmtree(os.environ['RUSTUP_HOME'], ignore_errors=True)"
          rustup toolchain install 1.88.0 --profile minimal
          rustc --version
          cargo --version
      - name: Check native core with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cmake --preset sanitize
          cmake --build --preset sanitize
          ctest --preset sanitize
      - name: Check the Rust C++ bridge with native sanitizers
        env:
          METAXTRACT_SANITIZERS: address,undefined
        run: python conformance/run.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: legacy/python/pyproject.toml
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./legacy/python[dev]"
      - name: Lint source
        run: python -m ruff check legacy/python
      - name: Build wheel
        run: python -m build --wheel legacy/python --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: metaxtract-wheel
          path: dist/*.whl
          if-no-files-found: error

  installed-cli:
    name: Installed CLI (${{ matrix.label }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux / Python 3.11
            os: ubuntu-latest
            python: "3.11"
          - label: Windows / Python 3.11
            os: windows-latest
            python: "3.11"
          - label: macOS / Python 3.11
            os: macos-latest
            python: "3.11"
          - label: Linux / Python 3.14
            os: ubuntu-latest
            python: "3.14"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: metaxtract-wheel
          path: dist
      - name: Install built wheel
        run: |
          python -m pip install --upgrade pip
          python -c "from pathlib import Path; import subprocess, sys; wheels = list(Path('dist').glob('*.whl')); assert len(wheels) == 1; subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheels[0])])"
      - name: Check installed entry points
        run: |
          metaxtract --help
          metaxtract doctor
          python -m metaxtract --help
          python -c "import metaxtract.gui; print('GUI import OK')"
      - name: Run installed CLI workflow
        run: |
          python -c "from pathlib import Path; root = Path('smoke-data'); root.mkdir(); (root / 'evidence.txt').write_text('cross-platform smoke test', encoding='utf-8')"
          metaxtract scan smoke-data --cache off --out scan.jsonl
          metaxtract report scan.jsonl --out report.json
          metaxtract verify scan.jsonl smoke-data
          metaxtract keygen private.pem public.pem
          metaxtract export-case scan.jsonl case.zip --include-files --files-base smoke-data --signing-key private.pem
          metaxtract verify-bundle case.zip --public-key public.pem

  package-windows:
    name: Standalone Windows GUI
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: legacy/python/pyproject.toml
      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./legacy/python[package]"
      - name: Build standalone executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name MetaXtract
          --icon legacy/python/src/metaxtract/assets/metaxtract.ico
          --collect-submodules metaxtract
          --collect-data metaxtract
          legacy/python/src/metaxtract/gui.py
      - name: Smoke-test executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\MetaXtract.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "MetaXtract.exe exited before the GUI smoke check completed."
          }
          Stop-Process -Id $process.Id
          Get-FileHash ".\dist\MetaXtract.exe" -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: MetaXtract-Windows
          path: dist/MetaXtract.exe
          if-no-files-found: error
