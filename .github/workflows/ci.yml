name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint source
        run: python -m ruff check .
      - name: Test
        run: python -m pytest
      - name: Build wheel
        run: python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: metaxtract-wheel
          path: dist/*.whl
          if-no-files-found: error

  installed-cli:
    name: Installed CLI (${{ matrix.label }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux / Python 3.11
            os: ubuntu-latest
            python: "3.11"
          - label: Windows / Python 3.11
            os: windows-latest
            python: "3.11"
          - label: macOS / Python 3.11
            os: macos-latest
            python: "3.11"
          - label: Linux / Python 3.14
            os: ubuntu-latest
            python: "3.14"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: metaxtract-wheel
          path: dist
      - name: Install built wheel
        run: |
          python -m pip install --upgrade pip
          python -c "from pathlib import Path; import subprocess, sys; wheels = list(Path('dist').glob('*.whl')); assert len(wheels) == 1; subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheels[0])])"
      - name: Check installed entry points
        run: |
          metaxtract --help
          metaxtract doctor
          python -m metaxtract --help
      - name: Run installed CLI workflow
        run: |
          python -c "from pathlib import Path; root = Path('smoke-data'); root.mkdir(); (root / 'evidence.txt').write_text('cross-platform smoke test', encoding='utf-8')"
          metaxtract scan smoke-data --cache off --out scan.jsonl
          metaxtract report scan.jsonl --out report.json
          metaxtract verify scan.jsonl smoke-data
          metaxtract keygen private.pem public.pem
          metaxtract export-case scan.jsonl case.zip --include-files --files-base smoke-data --signing-key private.pem
          metaxtract verify-bundle case.zip --public-key public.pem

  package-windows:
    name: Standalone Windows GUI
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[package]"
      - name: Build standalone executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name MetaXtract
          --collect-submodules metaxtract
          src/metaxtract/gui.py
      - name: Smoke-test executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\MetaXtract.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "MetaXtract.exe exited before the GUI smoke check completed."
          }
          Stop-Process -Id $process.Id
          Get-FileHash ".\dist\MetaXtract.exe" -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: MetaXtract-Windows
          path: dist/MetaXtract.exe
          if-no-files-found: error
